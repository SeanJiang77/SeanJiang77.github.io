<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tianqi Jiang | Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="landing">
  <div class="overlay"></div>

  <div class="center-content">
    <h1 class="logo">Tianqi <span>Jiang</span></h1>
    <p class="typing" id="typing-text"></p>
    <a href="portfolio/port.html" class="enter-btn">Enter Portfolio</a>
  </div>

  <canvas id="bg"></canvas>

  <script>
  // ---- Typing animation ----
  const roles = [
    "Software Developer",
    "iOS Engineer",
    "Full-Stack Builder",
    "Problem Solver"
  ];
  let index = 0, charIndex = 0;
  const typingElement = document.getElementById("typing-text");

  function type() {
    if (charIndex < roles[index].length) {
      typingElement.textContent += roles[index].charAt(charIndex);
      charIndex++;
      setTimeout(type, 100);
    } else {
      setTimeout(erase, 1500);
    }
  }
  function erase() {
    if (charIndex > 0) {
      typingElement.textContent = roles[index].substring(0, charIndex - 1);
      charIndex--;
      setTimeout(erase, 50);
    } else {
      index = (index + 1) % roles.length;
      setTimeout(type, 300);
    }
  }
  document.addEventListener("DOMContentLoaded", () => type());

  // ---- Simple matrix-like background ----
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  canvas.height = window.innerHeight;
  canvas.width = window.innerWidth;
  const letters = "01";
  const fontSize = 16;
  const columns = canvas.width / fontSize;
  const drops = Array(Math.floor(columns)).fill(1);

  function draw() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00ff88";
    ctx.font = fontSize + "px JetBrains Mono";
    for (let i = 0; i < drops.length; i++) {
      const text = letters.charAt(Math.floor(Math.random() * letters.length));
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }
  setInterval(draw, 35);
  </script>

  <style>
  body.landing {
    margin: 0;
    overflow: hidden;
    background: #000;
    color: #00ff88;
    font-family: 'JetBrains Mono', monospace;
  }
  canvas#bg {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
  }
  .overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.3);
    z-index: 1;
  }
  .center-content {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .logo {
    font-size: 2.5rem;
    letter-spacing: 2px;
    margin-bottom: 1rem;
  }
  .logo span {
    color: #fff;
  }
  .typing {
    height: 24px;
    color: #00ff88;
    font-weight: 600;
    margin-bottom: 2rem;
  }
  .enter-btn {
    text-decoration: none;
    background: #00ff88;
    color: #000;
    padding: 0.8rem 1.6rem;
    border-radius: 4px;
    font-weight: bold;
    transition: 0.3s;
  }
  .enter-btn:hover {
    background: #fff;
  }
  </style>
</body>
</html>
